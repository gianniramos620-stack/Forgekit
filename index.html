<!DOCTYPE html>
<html>
<head>
  <title>ForgeKit - Game Growth AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 30px 20px;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .tagline {
      color: #9da3b4;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .card {
      background: #191d26;
      border: 1px solid #303642;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #c8ccd7;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #3a404d;
      background: #0d0f14;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #6c63ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .result {
      display: none;
    }

    .finding {
      background: #11141b;
      border-radius: 9px;
      padding: 15px;
      margin-top: 12px;
    }

    .label {
      color: #8f96a8;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">ForgeKit</div>

  <div class="tagline">
    Turn game data into your next best move.
  </div>

  <div class="card">

    <h2>Analyze your game</h2>

    <label>Game name</label>
    <input id="game" placeholder="Example: Parrystreak REBORN">

    <label>Views / players</label>
    <input id="views" type="number" placeholder="27">

    <label>Favorites / wishlists</label>
    <input id="favorites" type="number" placeholder="4">

    <label>Likes / loves</label>
    <input id="likes" type="number" placeholder="5">

    <label>Comments</label>
    <input id="comments" type="number" placeholder="7">

    <label>Describe your game</label>
    <textarea id="description"
      placeholder="What is your game about? What do players do?"></textarea>

    <button onclick="analyze()">Analyze my game</button>

  </div>

  <div class="card result" id="result">

    <div class="label">Game Health Score</div>

    <div class="score" id="score">--</div>

    <h2>Biggest finding</h2>

    <div class="finding">
      <div class="label">Diagnosis</div>
      <p id="diagnosis"></p>
    </div>

    <div class="finding">
      <div class="label">Evidence</div>
      <p id="evidence"></p>
    </div>

    <div class="finding">
      <div class="label">Recommended experiment</div>
      <p id="experiment"></p>
    </div>

    <div class="finding">
      <div class="label">Success metric</div>
      <p id="metric"></p>
    </div>

  </div>

</div><script>

function analyze() {

  const game = document.getElementById("game").value || "Your game";

  const views =
    Number(document.getElementById("views").value) || 0;

  const favorites =
    Number(document.getElementById("favorites").value) || 0;

  const likes =
    Number(document.getElementById("likes").value) || 0;

  const comments =
    Number(document.getElementById("comments").value) || 0;

  let engagement = 0;

  if (views > 0) {
    engagement =
      ((favorites + likes + comments) / views) * 100;
  }

  let score = 50;

  if (engagement >= 20) {
    score += 30;
  } else if (engagement >= 10) {
    score += 20;
  } else if (engagement >= 5) {
    score += 10;
  }

  if (views < 100) {
    score -= 5;
  }

  score = Math.max(0, Math.min(100, score));

  document.getElementById("score").textContent =
    score + "/100";

  if (views < 100 && engagement >= 20) {

    document.getElementById("diagnosis").textContent =
      "Your game may have a discovery problem.";

    document.getElementById("evidence").textContent =
      game + " has strong interaction compared with its current reach. " +
      "That suggests the people who find the game may be interested, " +
      "but the game is not reaching enough people yet.";

    document.getElementById("experiment").textContent =
      "Test a new thumbnail, title, or project-page hook that communicates " +
      "the core gameplay immediately.";

    document.getElementById("metric").textContent =
      "Compare views-to-plays conversion before and after the change.";

  } else {

    document.getElementById("diagnosis").textContent =
      "ForgeKit needs more data before making a confident diagnosis.";

    document.getElementById("evidence").textContent =
      "The current sample is too small or the engagement pattern is unclear.";

    document.getElementById("experiment").textContent =
      "Collect more data and test one major change at a time.";

    document.getElementById("metric").textContent =
      "Track plays, retention, and engagement before and after each experiment.";
  }

  document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
